<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificação de E-mail</title>
</head>
<body>
  <div class="container">
    <h2>Verifique seu E-mail</h2>
    <p>Insira seu e-mail e o código enviado para validação.</p>
    <input type="email" id="email" placeholder="Seu e-mail" required>
    <input type="text" id="codigo" placeholder="Código de verificação" required>
    <button onclick="enviarDados()">Verificar</button>
    <p class="success" id="mensagemSucesso">Verificado com sucesso!</p>
  </div>
</body>
</html>
